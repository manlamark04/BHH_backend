# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → select this repo.
# Secrets marked `sync: false` must be filled in on the Render dashboard.
services:
  - type: web
    name: bhh-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOADS_DIR
        value: uploads
      # Your Hostinger domain(s), comma-separated, no trailing slash
      # e.g. https://yourdomain.com,https://www.yourdomain.com
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Remote MySQL database (Render does not host MySQL)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "false"
      # Optional email settings
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    # Uploaded files are lost on every redeploy unless you attach a disk
    # (requires a paid plan). Uncomment and set UPLOADS_DIR to match:
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/uploads
    #   sizeGB: 1
